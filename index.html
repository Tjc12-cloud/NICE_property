<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>共建资产墙 · NICE科创</title>
<style>
    /* ===== 全局变量（沿用工具箱主题） ===== */
    :root {
        --bg: #f0f4f8;
        --glass-bg: rgba(255, 255, 255, 0.72);
        --card-bg: rgba(255, 255, 255, 0.82);
        --text: #1e293b;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border: rgba(203, 213, 225, 0.55);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.07), 0 4px 12px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.12), 0 8px 20px rgba(0, 0, 0, 0.06);
        --primary: #6366f1;
        --primary-light: #eef0ff;
        --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
        --danger: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
        --radius-sm: 12px;
        --radius: 20px;
        --radius-lg: 28px;
        --radius-xl: 36px;
        --transition: 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    }
    [data-theme="dark"] {
        --bg: #0b1120;
        --glass-bg: rgba(15, 23, 42, 0.75);
        --card-bg: rgba(30, 41, 59, 0.85);
        --text: #e2e8f0;
        --text-secondary: #b0bec5;
        --text-muted: #64748b;
        --border: rgba(51, 65, 85, 0.65);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6);
        --primary: #818cf8;
        --primary-light: #1e2440;
        --danger: #f87171;
        --success: #34d399;
        --warning: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
        transition: background 0.6s, color 0.6s;
        overflow-x: hidden;
        position: relative;
    }
    body::before, body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
            radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 50%);
        animation: bgShift 12s ease-in-out infinite alternate;
    }
    body::after {
        background:
            radial-gradient(circle at 60% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 50%),
            radial-gradient(circle at 10% 70%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        animation: bgShift 15s ease-in-out infinite alternate-reverse;
    }
    @keyframes bgShift {
        0% { opacity: 0.4; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.05); }
    }

    .app-container {
        position: relative;
        z-index: 1;
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 20px 60px;
    }

    /* ===== 头部 ===== */
    .header { text-align: center; padding: 32px 20px 20px; }
    .header-logo {
        display: inline-block;
        font-size: 2.8rem;
        font-weight: 800;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        animation: float 3s ease-in-out infinite;
        letter-spacing: -0.5px;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .header-subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
        opacity: 0.9;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .header-subtitle .site-master {
        display: inline-block;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 600;
        transition: transform 0.3s ease, filter 0.3s ease;
        cursor: default;
    }
    .header-subtitle .site-master:hover {
        transform: scale(1.08) rotate(-2deg);
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
    }
    .header-stats {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 24px;
        flex-wrap: wrap;
    }
    .stat-item {
        background: var(--glass-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 24px;
        font-size: 0.95rem;
        color: var(--text-secondary);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(12px);
        transition: all var(--transition);
        transform: translateY(0);
    }
    .stat-item:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .stat-item .stat-num {
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--primary);
        font-family: 'SF Mono', 'Cascadia Code', monospace;
    }

    /* ===== 理念提示条 ===== */
    .dev-notice {
        background: var(--glass-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin: 0 auto 24px;
        max-width: 760px;
        color: var(--text-secondary);
        font-size: 0.88rem;
        padding: 14px 24px;
        text-align: center;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(12px);
        line-height: 1.7;
    }
    .dev-notice strong { color: var(--primary); font-weight: 700; }

    /* ===== 工具栏 ===== */
    .toolbar {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        margin: 8px 0 24px;
        position: sticky;
        top: 16px;
        z-index: 20;
        padding: 12px 0;
    }
    .toolbar-inner {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        background: var(--glass-bg);
        border-radius: var(--radius-xl);
        padding: 10px 20px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        transition: all var(--transition);
    }
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-radius: 32px;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all var(--transition);
        white-space: nowrap;
        font-family: inherit;
        background: transparent;
        color: var(--text);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }
    .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0;
        transition: opacity 0.3s;
    }
    .btn:hover::after { opacity: 0.08; }
    .btn:active { transform: scale(0.96); transition: 0.1s; }
    .btn-primary {
        background: var(--primary-gradient);
        color: #fff;
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        font-weight: 600;
    }
    .btn-primary:hover {
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6);
        transform: translateY(-2px);
    }
    .btn-outline {
        background: var(--card-bg);
        border: 1px solid var(--border);
    }
    .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
        transform: translateY(-2px);
    }
    .btn-sm { padding: 8px 16px; font-size: 0.8rem; border-radius: 28px; }

    /* 主题开关 */
    .theme-toggle-wrapper { display: flex; align-items: center; flex-shrink: 0; }
    .theme-toggle {
        position: relative;
        width: 52px;
        height: 30px;
        background: var(--glass-bg);
        border: 1px solid var(--border);
        border-radius: 30px;
        cursor: pointer;
        transition: all var(--transition);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 6px;
        user-select: none;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .theme-toggle:hover { transform: scale(1.04); box-shadow: var(--shadow); }
    .theme-toggle:active { transform: scale(0.94); }
    .theme-toggle .toggle-ball {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        background: var(--primary-gradient);
        border-radius: 50%;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        z-index: 2;
    }
    [data-theme="dark"] .theme-toggle .toggle-ball { left: calc(100% - 27px); }
    .theme-toggle .toggle-icon {
        font-size: 14px;
        z-index: 1;
        line-height: 1;
        pointer-events: none;
        transition: color 0.3s;
    }
    .theme-toggle .sun-icon { color: #fbbf24; }
    .theme-toggle .moon-icon { color: var(--text-muted); }
    [data-theme="dark"] .theme-toggle .moon-icon { color: #a78bfa; }
    [data-theme="dark"] .theme-toggle .sun-icon { color: var(--text-muted); }

    /* 搜索 */
    .search-wrapper {
        position: relative;
        flex: 1;
        min-width: 180px;
        max-width: 420px;
    }
    .search-input {
        width: 100%;
        padding: 14px 20px 14px 48px;
        border-radius: 32px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        font-size: 0.95rem;
        transition: all var(--transition);
        outline: none;
        font-family: inherit;
        backdrop-filter: blur(12px);
    }
    .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }
    .search-input:focus~.search-icon { color: var(--primary); }
    .search-clear {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 1.1rem;
        padding: 6px;
        border-radius: 50%;
        display: none;
    }
    .search-clear.visible { display: flex; align-items: center; justify-content: center; }
    .search-clear:hover { color: var(--danger); }

    /* 更多菜单 */
    .more-menu-wrapper { position: relative; }
    .more-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 10px;
        background: var(--glass-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        padding: 8px;
        min-width: 200px;
        z-index: 50;
        display: none;
        flex-direction: column;
        gap: 6px;
        backdrop-filter: blur(24px);
        animation: menuIn 0.25s ease;
    }
    @keyframes menuIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .more-menu.open { display: flex; }
    .more-menu .btn { width: 100%; justify-content: flex-start; padding: 12px 16px; }

    .sort-select {
        padding: 10px 18px;
        border-radius: 30px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
        font-family: inherit;
        cursor: pointer;
        backdrop-filter: blur(10px);
    }

    /* ===== 分类标签 ===== */
    .category-tabs {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 24px 0 32px;
    }
    .category-tab {
        padding: 12px 26px;
        border-radius: 34px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 500;
        transition: all var(--transition);
        white-space: nowrap;
        user-select: none;
        backdrop-filter: blur(12px);
        position: relative;
        overflow: hidden;
        font-family: inherit;
    }
    .category-tab::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 34px;
        background: var(--primary-gradient);
        opacity: 0;
        transition: opacity 0.3s;
        z-index: -1;
    }
    .category-tab:hover { color: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
    .category-tab.active {
        color: #fff;
        border-color: transparent;
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        font-weight: 600;
    }
    .category-tab.active::before { opacity: 1; }
    .category-tab .tab-count {
        display: inline-block;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 14px;
        padding: 2px 12px;
        font-size: 0.8rem;
        margin-left: 8px;
        font-weight: 600;
    }
    .category-tab.active .tab-count { background: rgba(255, 255, 255, 0.35); }

    /* ===== 资产卡片网格 ===== */
    .assets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 24px;
        min-height: 300px;
    }

    .asset-card {
        --accent: var(--primary);
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 26px 22px 20px;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
        backdrop-filter: blur(16px);
        animation: cardAppear 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        outline: none;
    }
    @keyframes cardAppear {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    /* 左侧强调色条 */
    .asset-card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--accent);
        opacity: 0.85;
        transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    /* 高光扫过 */
    .asset-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 150%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
        transition: left 0.7s;
        pointer-events: none;
    }
    .asset-card:hover::after { left: 150%; }
    .asset-card:hover,
    .asset-card:focus-visible {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 35px 70px rgba(0, 0, 0, 0.15), 0 12px 24px rgba(0, 0, 0, 0.08);
        border-color: var(--accent);
    }
    .asset-card:hover::before { width: 6px; }
    .asset-card:active { transform: scale(0.97); transition: 0.1s; }

    .asset-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-right: 38px;
        min-height: 40px;
    }
    .asset-icon {
        font-size: 2.2rem;
        line-height: 1;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .asset-card:hover .asset-icon { transform: scale(1.15) rotate(-8deg); }
    .asset-tag {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .tag-method { background: rgba(99, 102, 241, 0.13); color: #6366f1; }
    .tag-tool { background: rgba(16, 185, 129, 0.14); color: #059669; }
    .tag-teach { background: rgba(245, 158, 11, 0.16); color: #d97706; }
    .tag-solution { background: rgba(236, 72, 153, 0.13); color: #db2777; }
    .tag-other { background: rgba(148, 163, 184, 0.18); color: #64748b; }
    [data-theme="dark"] .tag-method { background: rgba(129, 140, 248, 0.2); color: #a5b4fc; }
    [data-theme="dark"] .tag-tool { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; }
    [data-theme="dark"] .tag-teach { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }
    [data-theme="dark"] .tag-solution { background: rgba(244, 114, 182, 0.2); color: #f9a8d4; }
    [data-theme="dark"] .tag-other { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .asset-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text);
        line-height: 1.45;
    }
    .asset-no {
        color: var(--text-muted);
        font-size: 0.78rem;
        font-weight: 600;
        margin-right: 5px;
        font-family: 'SF Mono', 'Cascadia Code', monospace;
    }
    .asset-core {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.6;
    }
    .asset-rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px dashed var(--border);
    }
    .asset-row {
        display: flex;
        gap: 8px;
        font-size: 0.79rem;
        line-height: 1.55;
    }
    .row-label {
        flex-shrink: 0;
        color: var(--text-muted);
        font-weight: 600;
        min-width: 58px;
    }
    .row-value {
        color: var(--text-secondary);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .asset-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.74rem;
        color: var(--text-muted);
        padding-top: 12px;
        border-top: 1px solid var(--border);
        margin-top: 2px;
    }
    .open-link {
        display: inline-block;
        color: var(--accent);
        font-weight: 700;
        transition: transform 0.3s;
    }
    .asset-card:hover .open-link { transform: translateX(5px); }

    .card-action-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--card-bg);
        cursor: pointer;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        box-shadow: var(--shadow-sm);
        transition: all 0.25s;
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(-6px);
        z-index: 3;
    }
    .asset-card:hover .card-action-btn,
    .asset-card:focus-within .card-action-btn { opacity: 1; transform: translateY(0); }
    .card-action-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
        transform: scale(1.12);
    }
    @media (hover: none) {
        .card-action-btn { opacity: 1; transform: none; }
    }

    /* 空状态 */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-muted);
        grid-column: 1 / -1;
    }
    .empty-state .empty-icon {
        font-size: 6rem;
        display: block;
        margin-bottom: 24px;
        animation: float 4s ease-in-out infinite;
    }
    .empty-state .empty-title { font-size: 1.1rem; font-weight: 600; color: var(--text-secondary); }
    .empty-state .empty-desc { font-size: 0.85rem; margin-top: 6px; }

    /* Toast */
    .toast-container {
        position: fixed;
        top: 28px;
        right: 28px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .toast {
        padding: 16px 28px;
        border-radius: var(--radius);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: toastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-width: 400px;
        backdrop-filter: blur(24px);
    }
    .toast.success { background: rgba(16, 185, 129, 0.92); }
    .toast.error { background: rgba(239, 68, 68, 0.92); }
    .toast.info { background: rgba(99, 102, 241, 0.92); }
    .toast.warning { background: rgba(245, 158, 11, 0.92); }
    @keyframes toastIn {
        from { opacity: 0; transform: translateX(90px) scale(0.9); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes toastOut {
        from { opacity: 1; transform: translateX(0) scale(1); }
        to { opacity: 0; transform: translateX(90px) scale(0.9); }
    }

    /* 页脚 */
    .footer {
        text-align: center;
        padding: 40px 20px 30px;
        color: var(--text-muted);
        font-size: 0.8rem;
        line-height: 1.8;
        position: relative;
        z-index: 1;
    }
    .footer .copyright { font-weight: 500; color: var(--text-secondary); }
    .footer .site-master-footer {
        display: inline-block;
        margin-top: 4px;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 600;
        transition: transform 0.3s ease, filter 0.3s ease;
        cursor: default;
    }
    .footer .site-master-footer:hover {
        transform: scale(1.06);
        filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.3));
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
        .app-container { padding: 12px 12px 60px; }
        .header { padding: 20px 10px 12px; }
        .header-logo { font-size: 2rem; }
        .header-subtitle { font-size: 0.85rem; gap: 4px; }
        .header-stats { gap: 10px; margin-top: 16px; }
        .stat-item { padding: 10px 16px; font-size: 0.78rem; border-radius: 16px; }
        .stat-item .stat-num { font-size: 1.05rem; }
        .dev-notice { font-size: 0.78rem; padding: 10px 16px; margin-bottom: 16px; }
        .toolbar { margin: 4px 0 16px; padding: 6px 0; top: 8px; }
        .toolbar-inner { border-radius: 28px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .search-wrapper { min-width: 120px; flex-basis: 100%; max-width: 100%; }
        .search-input { padding: 12px 16px 12px 40px; font-size: 0.85rem; }
        .search-icon { left: 14px; font-size: 0.9rem; }
        .sort-select { font-size: 0.75rem; padding: 8px 12px; }
        .btn { font-size: 0.75rem; padding: 6px 14px; }
        .btn-sm { padding: 6px 12px; font-size: 0.7rem; }
        .theme-toggle { width: 44px; height: 26px; padding: 0 4px; }
        .theme-toggle .toggle-ball { width: 20px; height: 20px; top: 3px; left: 3px; }
        [data-theme="dark"] .theme-toggle .toggle-ball { left: calc(100% - 23px); }
        .theme-toggle .toggle-icon { font-size: 12px; }
        .category-tabs {
            gap: 8px; margin: 16px 0 20px; flex-wrap: nowrap; overflow-x: auto;
            justify-content: flex-start; padding: 4px 2px; -webkit-overflow-scrolling: touch;
        }
        .category-tab { padding: 8px 16px; font-size: 0.78rem; flex-shrink: 0; }
        .category-tab .tab-count { padding: 0 8px; font-size: 0.7rem; margin-left: 4px; }
        .assets-grid { grid-template-columns: 1fr; gap: 16px; }
        .asset-card { padding: 20px 16px 16px; border-radius: 20px; gap: 10px; }
        .asset-head { padding-right: 34px; }
        .asset-icon { font-size: 1.9rem; }
        .asset-title { font-size: 1rem; }
        .asset-core { font-size: 0.8rem; }
        .asset-row { font-size: 0.75rem; }
        .row-label { min-width: 52px; }
        .asset-footer { font-size: 0.7rem; }
        .card-action-btn { width: 28px; height: 28px; font-size: 0.72rem; top: 12px; right: 12px; }
        .footer { padding: 24px 12px 20px; font-size: 0.7rem; }
    }
    @media (max-width: 400px) {
        .header-logo { font-size: 1.7rem; }
        .stat-item { padding: 8px 12px; font-size: 0.7rem; }
        .stat-item .stat-num { font-size: 1rem; }
        .toolbar-inner { padding: 6px 8px; }
        .btn { font-size: 0.7rem; padding: 4px 10px; }
        .sort-select { font-size: 0.7rem; padding: 6px 10px; }
        .category-tab { padding: 6px 12px; font-size: 0.7rem; }
        .theme-toggle { width: 38px; height: 22px; padding: 0 3px; }
        .theme-toggle .toggle-ball { width: 16px; height: 16px; top: 3px; left: 3px; }
        [data-theme="dark"] .theme-toggle .toggle-ball { left: calc(100% - 19px); }
        .theme-toggle .toggle-icon { font-size: 10px; }
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="header">
        <div class="header-logo">共建资产墙</div>
        <p class="header-subtitle">
            可复用的经验 · 会生长的展板
            <span class="site-master">· 站长：Tjc</span>
        </p>
        <div class="header-stats">
            <div class="stat-item">🧱 资产总数 <span class="stat-num" id="totalCount">0</span></div>
            <div class="stat-item">🗂️ 资产类别 <span class="stat-num" id="categoryCount">0</span></div>
            <div class="stat-item">👥 贡献者 <span class="stat-num" id="contributorCount">0</span></div>
            <div class="stat-item">🖱️ 总访问 <span class="stat-num" id="totalClicks">0</span></div>
        </div>
    </header>

    <div class="dev-notice">
        这里收集的是大家在动手实践里一点点攒下来的经验，希望能帮后来的人少绕些弯路。<br />
        点击卡片即可打开对应的飞书文档，看看它当时是怎么用的。
    </div>

    <div class="toolbar">
        <div class="toolbar-inner">
            <div class="search-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索资产 / 贡献者 / 关键词" />
                <span class="search-icon">🔍</span>
                <button class="search-clear" id="searchClear">✕</button>
            </div>
            <select class="sort-select" id="sortOrder">
                <option value="number">🔢 按编号</option>
                <option value="newest">🕐 最新贡献</option>
                <option value="clicks">🔥 最热访问</option>
            </select>
            <div class="more-menu-wrapper">
                <button class="btn btn-outline btn-sm" id="btnMore">⚙️ 更多</button>
                <div class="more-menu" id="moreMenu">
                    <button class="btn btn-sm" id="btnExport">📥 导出数据备份</button>
                    <button class="btn btn-sm" id="btnTemplate">📝 内容模板说明</button>
                </div>
            </div>
            <div class="theme-toggle-wrapper">
                <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="切换深色/浅色模式">
                    <span class="toggle-icon sun-icon">☀️</span>
                    <span class="toggle-icon moon-icon">🌙</span>
                    <span class="toggle-ball"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>
    <div class="assets-grid" id="assetsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
        <span class="empty-icon">🧱</span>
        <div class="empty-title">这面墙上还没有内容</div>
        <div class="empty-desc">去发现身边值得复用的经验，邀请 TA 一起上墙吧</div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<footer class="footer">
    <p class="copyright">© 2026 共建资产墙 · NICE科创 —— 让一个人的踩坑，变成所有人的捷径</p>
    <p style="opacity:0.7;font-size:0.8rem">
        按 <kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索 · <kbd>Alt</kbd>+<kbd>T</kbd> 切换主题
        <br />
        <span class="site-master-footer">站长：Tjc</span>
    </p>
</footer>

<script>
(function () {
    'use strict';

    /* ============================================================
       ★★★ 资产数据区（唯一需要修改的地方）★★★
       ------------------------------------------------------------
       新增一条资产，就往数组里加一个对象：
       {
           id:          '唯一编号，不重复即可，如 asset-004',
           number:      4,                        // 展示用的编号 #4
           category:    '方法论',                  // 方法论 / 实用工具 / 教学方法 / 解决方案
           icon:        '🧠',                      // 卡片图标（emoji）
           title:       '资产名称',
           core:        '一句话说清楚你贡献了什么',
           contributor: '竞赛班·某某某',
           application: '这个东西在哪个环节用过',
           usage:       '后来者看到它，怎么用？',
           url:         '飞书文档链接（点卡片跳这里）',
           date:        '2026-08-20'               // 贡献日期，用于「最新贡献」排序
       }
       ============================================================ */

    const ASSETS = [
        {
            id: 'asset-001',
            number: 1,
            category: '方法论',
            icon: '📐',
            title: '在线量角器',
            core: '在线量角器 —— 解决 MCU 底板焊点凸出、无法用传统量角器测量的难题',
            contributor: '竞赛班·唐锦程',
            application: '2026 暑期竞赛班 · MCU 底板切割环节',
            usage: '遇到不规则针脚角度测量时，可用此工具替代传统量角器，照片上传即可自动计算角度。',
            url: 'https://wcnacsf7svy4.feishu.cn/docx/N5SydpyrdoM2z6xs3M1c7orUn7b',
            date: '2026-08-10'
        },
        {
            id: 'asset-002',
            number: 2,
            category: '方法论',
            icon: '📝',
            title: '共建资产墙 · 内容模板',
            core: '共建资产墙的标准内容模板 —— 统一五个字段，让每一份经验都清晰可复用',
            contributor: 'NICE科创',
            application: '所有需要整理上墙的资产条目',
            usage: '在贡献资产前，先按模板填写五个字段：贡献者、资产类别、核心内容、应用记录、后来者如何使用。整理完再提交上墙。',
            url: 'https://wcnacsf7svy4.feishu.cn/docx/Gy8kdw1qRotRkoxC4m2cu6l2nzf',
            date: '2026-08-01'
        },
        {
            id: 'asset-003',
            number: 3,
            category: '实用工具',
            icon: '📏',
            title: '在线量角器工具',
            core: '解决 MCU 底板焊点凸出导致传统量角器无法贴合测量的难题',
            contributor: '竞赛班·唐锦程',
            application: '2026 暑期竞赛班・MCU 底板激光切割环节、3D 打印结构适配环节',
            usage: '遇到板面有凸起焊点、元件导致传统量角器无法平放测量角度时，拍摄待测部位正面照片上传至本工具，按指引标注三个点位即可自动计算精准角度。',
            url: 'https://wcnacsf7svy4.feishu.cn/docx/JpGkdRbFcok0vVxhNigc6HjMnss',
            date: '2026-08-20'
        }
    ];

    const CATEGORY_ORDER = ['方法论', '实用工具', '教学方法', '解决方案'];
    const CATEGORY_META = {
        '方法论':   { key: 'method',   accent: '#6366f1' },
        '实用工具': { key: 'tool',     accent: '#10b981' },
        '教学方法': { key: 'teach',    accent: '#f59e0b' },
        '解决方案': { key: 'solution', accent: '#ec4899' }
    };
    const DEFAULT_META = { key: 'other', accent: '#94a3b8' };

    const THEME_KEY = 'nice_asset_wall_theme';
    const CLICK_KEY = 'nice_asset_wall_clicks';

    /* ---------------- DOM ---------------- */
    const $ = id => document.getElementById(id);
    const $assetsGrid = $('assetsGrid');
    const $categoryTabs = $('categoryTabs');
    const $searchInput = $('searchInput');
    const $searchClear = $('searchClear');
    const $emptyState = $('emptyState');
    const $sortOrder = $('sortOrder');
    const $totalCount = $('totalCount');
    const $categoryCount = $('categoryCount');
    const $contributorCount = $('contributorCount');
    const $totalClicks = $('totalClicks');
    const $btnMore = $('btnMore');
    const $moreMenu = $('moreMenu');
    const $btnExport = $('btnExport');
    const $btnTemplate = $('btnTemplate');
    const $themeToggle = $('themeToggle');
    const $toastContainer = $('toastContainer');

    let assets = [];
    let currentCategory = '全部';
    let searchQuery = '';

    /* ================= 主题 ================= */
    function applyTheme(isDark) {
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }
    function loadTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) { applyTheme(saved === 'dark'); return; }
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(!!prefersDark);
    }
    function toggleTheme() {
        const isDark = document.documentElement.hasAttribute('data-theme');
        applyTheme(!isDark);
        if ($themeToggle) {
            $themeToggle.style.transform = 'scale(0.94)';
            setTimeout(() => { $themeToggle.style.transform = ''; }, 200);
        }
    }

    /* ================= 访问次数 ================= */
    function loadClicks() {
        let counts = {};
        try { counts = JSON.parse(localStorage.getItem(CLICK_KEY) || '{}'); } catch (e) { counts = {}; }
        assets = ASSETS.map(a => Object.assign({}, a, { clicks: counts[a.id] || 0 }));
    }
    function saveClicks() {
        const counts = {};
        assets.forEach(a => { counts[a.id] = a.clicks || 0; });
        localStorage.setItem(CLICK_KEY, JSON.stringify(counts));
    }

    /* ================= 分类 ================= */
    function getAllCategories() {
        const set = new Set();
        assets.forEach(a => { if (a.category && a.category.trim()) set.add(a.category.trim()); });
        const result = [];
        CATEGORY_ORDER.forEach(c => { if (set.has(c)) { result.push(c); set.delete(c); } });
        set.forEach(c => result.push(c));
        return result;
    }

    function getFilteredAssets() {
        let list = assets.slice();

        if (currentCategory !== '全部') {
            list = list.filter(a => (a.category || '').trim() === currentCategory);
        }

        const q = searchQuery.trim().toLowerCase();
        if (q) {
            list = list.filter(a => {
                return (
                    (a.title || '').toLowerCase().includes(q) ||
                    (a.core || '').toLowerCase().includes(q) ||
                    (a.contributor || '').toLowerCase().includes(q) ||
                    (a.application || '').toLowerCase().includes(q) ||
                    (a.usage || '').toLowerCase().includes(q) ||
                    (a.category || '').toLowerCase().includes(q)
                );
            });
        }

        const order = $sortOrder.value;
        if (order === 'number') {
            list.sort((a, b) => (a.number || 0) - (b.number || 0));
        } else if (order === 'newest') {
            list.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
        } else if (order === 'clicks') {
            list.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
        }
        return list;
    }

    /* ================= 渲染 ================= */
    function renderAll() {
        renderCategoryTabs();
        renderAssets();
        updateStats();
    }

    function renderCategoryTabs() {
        const cats = getAllCategories();
        let html = `<button class="category-tab${currentCategory === '全部' ? ' active' : ''}" data-category="全部">全部<span class="tab-count">${assets.length}</span></button>`;
        cats.forEach(cat => {
            const count = assets.filter(a => (a.category || '').trim() === cat).length;
            html += `<button class="category-tab${currentCategory === cat ? ' active' : ''}" data-category="${escapeAttr(cat)}">${escapeHTML(cat)}<span class="tab-count">${count}</span></button>`;
        });
        $categoryTabs.innerHTML = html;
        $categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentCategory = tab.dataset.category;
                renderAll();
            });
        });
    }

    function renderAssets() {
        const list = getFilteredAssets();
        if (list.length === 0) {
            $assetsGrid.innerHTML = '';
            $emptyState.style.display = 'block';
            return;
        }
        $emptyState.style.display = 'none';
        $assetsGrid.innerHTML = list.map((a, i) => createCardHTML(a, i)).join('');
    }

    function createCardHTML(a, index) {
        const meta = CATEGORY_META[(a.category || '').trim()] || DEFAULT_META;
        const delay = Math.min(index, 8) * 0.05;
        return `
        <article class="asset-card" data-id="${escapeAttr(a.id)}" tabindex="0" role="link"
                 aria-label="打开 ${escapeAttr(a.title || '')} 的飞书文档"
                 style="--accent:${meta.accent}; animation-delay:${delay}s">
            <button class="card-action-btn copy-btn" data-id="${escapeAttr(a.id)}" title="复制文档链接" aria-label="复制文档链接">🔗</button>
            <div class="asset-head">
                <span class="asset-icon">${a.icon || '🧱'}</span>
                <span class="asset-tag tag-${meta.key}">${escapeHTML(a.category || '未分类')}</span>
            </div>
            <h3 class="asset-title"><span class="asset-no">#${a.number || ''}</span>${escapeHTML(a.title || '')}</h3>
            <p class="asset-core">${escapeHTML(a.core || '')}</p>
            <div class="asset-rows">
                <div class="asset-row">
                    <span class="row-label">贡献者</span>
                    <span class="row-value">${escapeHTML(a.contributor || '—')}</span>
                </div>
                <div class="asset-row">
                    <span class="row-label">应用记录</span>
                    <span class="row-value">${escapeHTML(a.application || '—')}</span>
                </div>
                <div class="asset-row">
                    <span class="row-label">如何使用</span>
                    <span class="row-value">${escapeHTML(a.usage || '—')}</span>
                </div>
            </div>
            <div class="asset-footer">
                <span class="visit-count">🖱️ ${a.clicks || 0} 次访问</span>
                <span class="open-link">进入飞书文档 →</span>
            </div>
        </article>`;
    }

    function updateStats() {
        $totalCount.textContent = assets.length;
        $categoryCount.textContent = getAllCategories().length;
        const contributors = new Set(assets.map(a => (a.contributor || '').trim()).filter(Boolean));
        $contributorCount.textContent = contributors.size;
        $totalClicks.textContent = assets.reduce((s, a) => s + (a.clicks || 0), 0);
    }

    /* ================= 交互 ================= */
    function openAsset(id) {
        const a = assets.find(x => x.id === id);
        if (!a) return;
        const url = (a.url || '').trim();
        if (!url || url === '#') {
            showToast('⚠️ 这条资产还没填写飞书文档链接', 'warning');
            return;
        }
        a.clicks = (a.clicks || 0) + 1;
        saveClicks();
        renderAssets();
        updateStats();
        window.open(url, '_blank', 'noopener,noreferrer');
    }

    function copyAssetLink(id) {
        const a = assets.find(x => x.id === id);
        if (!a) return;
        const url = (a.url || '').trim();
        if (!url || url === '#') {
            showToast('⚠️ 这条资产还没填写文档链接', 'warning');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url)
                .then(() => showToast('✅ 链接已复制', 'success'))
                .catch(() => fallbackCopy(url));
        } else {
            fallbackCopy(url);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast('✅ 链接已复制', 'success');
        } catch (e) {
            showToast('❌ 复制失败，请手动复制', 'error');
        }
        document.body.removeChild(ta);
    }

    function bindEvents() {
        // 搜索
        $searchInput.addEventListener('input', debounce(() => {
            searchQuery = $searchInput.value;
            $searchClear.classList.toggle('visible', !!searchQuery.trim());
            renderAssets();
        }, 250));

        $searchClear.addEventListener('click', () => {
            $searchInput.value = '';
            searchQuery = '';
            $searchClear.classList.remove('visible');
            renderAssets();
            $searchInput.focus();
        });

        // 排序
        $sortOrder.addEventListener('change', renderAssets);

        // 更多菜单
        $btnMore.addEventListener('click', e => {
            e.stopPropagation();
            $moreMenu.classList.toggle('open');
        });
        document.addEventListener('click', e => {
            if (!$moreMenu.contains(e.target) && e.target !== $btnMore) {
                $moreMenu.classList.remove('open');
            }
        });

        // 主题
        $themeToggle.addEventListener('click', toggleTheme);
        $themeToggle.addEventListener('touchend', e => { e.preventDefault(); toggleTheme(); });

        // 导出
        $btnExport.addEventListener('click', () => {
            const data = assets.map(a => ({
                id: a.id, number: a.number, category: a.category, icon: a.icon,
                title: a.title, core: a.core, contributor: a.contributor,
                application: a.application, usage: a.usage, url: a.url, date: a.date
            }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '共建资产墙备份_' + new Date().toISOString().slice(0, 10) + '.json';
            link.click();
            showToast('📥 已导出备份', 'success');
        });

        // 模板说明
        $btnTemplate.addEventListener('click', () => {
            showToast('模板字段：贡献者 / 资产类别 / 核心内容 / 应用记录 / 后来者如何使用', 'info');
        });

        // 卡片点击
        $assetsGrid.addEventListener('click', e => {
            const card = e.target.closest('.asset-card');
            if (!card) return;
            const id = card.dataset.id;
            const copyBtn = e.target.closest('.copy-btn');
            if (copyBtn) {
                e.stopPropagation();
                copyAssetLink(id);
                return;
            }
            openAsset(id);
        });

        // 键盘可访问
        $assetsGrid.addEventListener('keydown', e => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.asset-card');
            if (!card) return;
            e.preventDefault();
            openAsset(card.dataset.id);
        });

        // 全局快捷键
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                $searchInput.focus();
                $searchInput.select();
            }
            if (e.altKey && e.key.toLowerCase() === 't') {
                e.preventDefault();
                toggleTheme();
            }
        });

        // 跟随系统主题
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) {
            mq.addEventListener('change', e => {
                if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches);
            });
        }
    }

    /* ================= Toast ================= */
    function showToast(msg, type) {
        type = type || 'info';
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = msg;
        $toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'toastOut 0.3s ease forwards';
            toast.addEventListener('animationend', () => toast.remove());
        }, 2600);
    }

    /* ================= 工具函数 ================= */
    function debounce(fn, delay) {
        let timer;
        return function () {
            const args = arguments, ctx = this;
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(ctx, args), delay);
        };
    }
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }
    function escapeAttr(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    /* ================= 启动 ================= */
    loadTheme();
    loadClicks();
    renderAll();
    bindEvents();

    console.log('%c🧱 共建资产墙已就绪', 'color:#6366f1;font-weight:bold;font-size:14px');
    console.log('📦 当前资产数：' + assets.length);
    console.log('💡 新增资产请编辑源码中的 ASSETS 数组');
})();
</script>
</body>
